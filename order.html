<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RestaurantOS — POS billing checkout</title>
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/order.css">
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="app-container">
    <!-- Navigation Dynamic Header Target -->
    <header class="main-header"></header>

    <!-- Main Workspace Content -->
    <main class="main-content">
      <div class="order-layout">
        
        <!-- Left Side: Catalog Catalog Grid & Search -->
        <section class="items-section">
          <div style="display: flex; gap: 16px; align-items: center; justify-content: space-between;">
            <div style="flex: 1; position: relative;">
              <input type="text" id="search-dishes" placeholder="Search dish names or description tags..." style="padding-left: 40px; width: 100%;">
              <i data-lucide="search" style="position: absolute; left: 14px; top: 12px; width: 16px; height: 16px; color: var(--text-muted);"></i>
            </div>
          </div>

          <!-- Mapped Category horizontal filter -->
          <div id="categories-tabs" class="categories-scroll">
            <!-- Dynamically populated category buttons -->
          </div>

          <!-- POS dishes grid -->
          <div id="catalog-grid" class="pos-items-grid">
            <!-- Dynamically populated dish cards -->
          </div>
        </section>

        <!-- Right Side: POS Table Checkout Cart -->
        <section class="glass-panel billing-section">
          <div class="billing-header">
            <label for="tables-select" style="margin-bottom: 8px; display: block;">Active Seating Context</label>
            <div style="position: relative;">
              <select id="tables-select" style="padding-right: 36px; width: 100%;">
                <option value="">-- Choose Seating Table --</option>
                <!-- Dynamically populated tables -->
              </select>
            </div>
          </div>

          <!-- Customer / B2B Details -->
          <div style="margin-top: 12px; border-top: 1px solid var(--border-color); padding-top: 10px;">
            <div style="display: flex; justify-content: space-between; align-items: center; cursor: pointer; margin-bottom: 8px;" id="toggle-customer-details">
              <span style="font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); display: flex; align-items: center; gap: 4px;">
                <i data-lucide="user" style="width: 12px; height: 12px;"></i>
                Customer / B2B Details
              </span>
              <i data-lucide="chevron-down" id="chevron-customer-details" style="width: 14px; height: 14px; color: var(--text-muted); transition: transform 0.2s;"></i>
            </div>
            <div id="customer-details-fields" style="display: none; flex-direction: column; gap: 8px; margin-top: 8px;">
              <div>
                <label for="order-customer-name" style="font-size: 8px; margin-bottom: 3px;">Customer Name</label>
                <input type="text" id="order-customer-name" placeholder="e.g. Rahul Sharma" style="padding: 6px 10px; font-size: 12px; height: 32px;">
              </div>
              <div style="display: flex; gap: 8px;">
                <div style="flex: 1;">
                  <label for="order-customer-mobile" style="font-size: 8px; margin-bottom: 3px;">Mobile Number</label>
                  <input type="tel" id="order-customer-mobile" placeholder="10-digit number" style="padding: 6px 10px; font-size: 12px; height: 32px;" maxlength="10">
                </div>
                <div style="flex: 1.2;">
                  <label for="order-customer-gstin" style="font-size: 8px; margin-bottom: 3px;">GSTIN (B2B)</label>
                  <input type="text" id="order-customer-gstin" placeholder="e.g. 27AABC1234F1Z5" style="padding: 6px 10px; font-size: 12px; height: 32px; text-transform: uppercase;" maxlength="15">
                </div>
              </div>
              <div>
                <label for="order-customer-company" style="font-size: 8px; margin-bottom: 3px;">Company Name</label>
                <input type="text" id="order-customer-company" placeholder="e.g. Acme Enterprises" style="padding: 6px 10px; font-size: 12px; height: 32px;">
              </div>
            </div>
          </div>

          <!-- Checkout active cart rows list -->
          <div id="cart-items-wrapper" class="cart-items-wrapper">
            <!-- Dynamic order rows -->
            <p class="text-xs text-slate-500 py-12 text-center" style="color: var(--text-muted); text-align: center; margin: auto 0;">Cart is empty. Select items to add.</p>
          </div>

          <!-- Billing aggregates calculations summary -->
          <div class="billing-summary">
            <div class="summary-row">
              <span>Subtotal</span>
              <span id="checkout-subtotal">₹0.00</span>
            </div>
            <div class="summary-row">
              <span>GST Tax (5%)</span>
              <span id="checkout-tax">₹0.00</span>
            </div>
            <div class="summary-row" style="align-items: center;">
              <span>Discounts Deduct</span>
              <div style="width: 100px; display: flex; align-items: center;">
                <input type="number" id="cart-discount" placeholder="0" min="0" step="1" style="padding: 4px 8px; font-size: 12px; height: 28px; text-align: right;">
              </div>
            </div>
            <div class="summary-row total">
              <span>Grand Total</span>
              <span id="checkout-grand-total">₹0.00</span>
            </div>
          </div>

          <!-- Actions triggers -->
          <div class="billing-actions">
            <button id="btn-send-kds" class="btn btn-secondary" style="flex: 1;">
              <i data-lucide="chef-hat" style="width: 16px; height: 16px;"></i>
              <span>Push KDS</span>
            </button>
            <button id="btn-pay-print" class="btn btn-primary" style="flex: 1.2;">
              <i data-lucide="printer" style="width: 16px; height: 16px;"></i>
              <span>Settle & Print</span>
            </button>
          </div>
        </section>

      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script type="module" src="js/order.js"></script>

</body>
</html>
