<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function() {
      if (localStorage.getItem('ros_theme') === 'light') {
        document.documentElement.classList.add('light-theme');
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>DiningOS — POS billing checkout</title>
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/order.css">
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="app-container">
    <!-- Navigation Dynamic Header Target -->
    <header class="main-header"></header>

    <!-- Main Workspace Content -->
    <main class="main-content">
      <div class="order-layout">
        
        <!-- Left Side: Catalog Catalog Grid & Search -->
        <section class="items-section">
          <div style="display: flex; gap: 16px; align-items: center; justify-content: space-between;">
            <div style="flex: 1; position: relative;">
              <input type="text" id="search-dishes" placeholder="Search dish names or description tags..." style="padding-left: 40px; width: 100%;">
              <i data-lucide="search" style="position: absolute; left: 14px; top: 12px; width: 16px; height: 16px; color: var(--text-muted);"></i>
            </div>
          </div>

          <!-- Mapped Category horizontal filter -->
          <div id="categories-tabs" class="categories-scroll">
            <!-- Dynamically populated category buttons -->
          </div>

          <!-- POS dishes grid -->
          <div id="catalog-grid" class="pos-items-grid pos-catalog-container">
            <!-- Dynamically populated dish cards -->
          </div>
        </section>

        <!-- Right Side: POS Table Checkout Cart -->
        <section class="glass-panel billing-section">
          <div class="billing-header">
            <label for="tables-select" style="margin-bottom: 8px; display: block;">Active Seating Context</label>
            <div style="position: relative;">
              <select id="tables-select" style="padding-right: 36px; width: 100%;">
                <option value="">-- Choose Seating Table --</option>
                <!-- Dynamically populated tables -->
              </select>
            </div>
          </div>

          <!-- Current Order Header Bar -->
          <div class="billing-header-bar">
            <span class="billing-header-title">Current Order</span>
            <button class="billing-header-btn" type="button" id="btn-order-info">
              <i data-lucide="info" style="width: 11px; height: 11px;"></i>
              <span>Order Info</span>
            </button>
          </div>

          <!-- Customer / B2B Details -->
          <div style="margin-top: 4px; border-top: 1px solid var(--border-color); padding-top: 10px;">
            <div style="display: flex; justify-content: space-between; align-items: center; cursor: pointer; margin-bottom: 8px;" id="toggle-customer-details">
              <span style="font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); display: flex; align-items: center; gap: 4px;">
                <i data-lucide="user" style="width: 12px; height: 12px;"></i>
                Customer / B2B Details
              </span>
              <i data-lucide="chevron-down" id="chevron-customer-details" style="width: 14px; height: 14px; color: var(--text-muted); transition: transform 0.2s;"></i>
            </div>
            <div id="customer-details-fields" style="display: none; flex-direction: column; gap: 8px; margin-top: 8px;">
              <div>
                <label for="order-customer-name" style="font-size: 8px; margin-bottom: 3px;">Customer Name</label>
                <input type="text" id="order-customer-name" placeholder="e.g. Rahul Sharma" style="padding: 6px 10px; font-size: 12px; height: 32px;">
              </div>
              <div style="display: flex; gap: 8px;">
                <div style="flex: 1;">
                  <label for="order-customer-mobile" style="font-size: 8px; margin-bottom: 3px;">Mobile Number</label>
                  <input type="tel" id="order-customer-mobile" placeholder="10-digit number" style="padding: 6px 10px; font-size: 12px; height: 32px;" maxlength="10">
                </div>
                <div style="flex: 1.2;">
                  <label for="order-customer-gstin" style="font-size: 8px; margin-bottom: 3px;">GSTIN (B2B)</label>
                  <input type="text" id="order-customer-gstin" placeholder="e.g. 27AABC1234F1Z5" style="padding: 6px 10px; font-size: 12px; height: 32px; text-transform: uppercase;" maxlength="15">
                </div>
              </div>
              <div>
                <label for="order-customer-company" style="font-size: 8px; margin-bottom: 3px;">Company Name</label>
                <input type="text" id="order-customer-company" placeholder="e.g. Acme Enterprises" style="padding: 6px 10px; font-size: 12px; height: 32px;">
              </div>
            </div>
          </div>

          <!-- Checkout active cart rows list -->
          <div id="cart-items-wrapper" class="cart-items-wrapper">
            <!-- Dynamic order rows -->
            <p class="text-xs text-slate-500 py-12 text-center" style="color: var(--text-muted); text-align: center; margin: auto 0;">Cart is empty. Select items to add.</p>
          </div>

          <!-- Billing aggregates calculations summary -->
          <div class="billing-summary">
            <div class="summary-row">
              <span>Subtotal</span>
              <span id="checkout-subtotal">₹0.00</span>
            </div>
            <div class="summary-row">
              <span>CGST (2.5%)</span>
              <span id="checkout-cgst">₹0.00</span>
            </div>
            <div class="summary-row">
              <span>SGST (2.5%)</span>
              <span id="checkout-sgst">₹0.00</span>
            </div>
            
            <div class="discount-control-panel" style="margin-top: 4px; border-top: 1px solid var(--border-color); padding-top: 10px;">
              <div style="display: flex; justify-content: space-between; align-items: center; cursor: pointer; margin-bottom: 8px;" id="toggle-discount-details">
                <span style="font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); display: flex; align-items: center; gap: 4px;">
                  <i data-lucide="percent" style="width: 12px; height: 12px;"></i>
                  Discounts & Offers
                </span>
                <i data-lucide="chevron-down" id="chevron-discount-details" style="width: 14px; height: 14px; color: var(--text-muted); transition: transform 0.2s;"></i>
              </div>
              
              <div id="discount-details-fields" style="display: none; flex-direction: column; gap: 6px;">
                <div class="discount-type-buttons" style="display: flex; gap: 4px;">
                  <button type="button" id="btn-discount-none" class="btn btn-secondary active" style="flex: 1; padding: 4px; font-size: 10px; height: 26px;">None</button>
                  <button type="button" id="btn-discount-flat" class="btn btn-secondary" style="flex: 1; padding: 4px; font-size: 10px; height: 26px;">Flat ₹</button>
                  <button type="button" id="btn-discount-percent" class="btn btn-secondary" style="flex: 1; padding: 4px; font-size: 10px; height: 26px;">Pct %</button>
                  <button type="button" id="btn-discount-item" class="btn btn-secondary" style="flex: 1; padding: 4px; font-size: 10px; height: 26px;">Item</button>
                </div>
                <div id="discount-inputs-container" style="display: none; align-items: center; gap: 6px; margin-top: 2px;">
                  <select id="discount-item-select" style="flex: 1.5; font-size: 11px; padding: 4px 8px; height: 32px; border-radius: 8px; background: rgba(0,0,0,0.2); color: #fff; border: 1px solid var(--border-color);">
                    <option value="">-- Choose Item --</option>
                  </select>
                  <input type="number" id="discount-value-input" placeholder="0" min="0" style="flex: 1; padding: 4px 8px; font-size: 12px; height: 32px; text-align: right; border-radius: 8px; background: rgba(0,0,0,0.2); color: #fff; border: 1px solid var(--border-color);">
                </div>
                <div class="summary-row" style="margin-top: 2px;">
                  <span>Discount Applied</span>
                  <span id="checkout-discount-applied" style="color: var(--danger); font-weight: 700;">₹0.00</span>
                </div>
              </div>
            </div>

            <!-- Payment Method Selector -->
            <div style="margin-top: 4px; border-top: 1px solid var(--border-color); padding-top: 8px; display: flex; flex-direction: column; gap: 6px;">
              <span style="font-size: 9px; font-weight: 700; text-transform: uppercase; color: var(--text-muted);">Payment Method</span>
              <div class="payment-methods-grid">
                <button type="button" class="payment-method-btn active" data-method="cash">
                  <i data-lucide="banknote" style="width: 13px; height: 13px;"></i>
                  <span>Cash</span>
                </button>
                <button type="button" class="payment-method-btn" data-method="card">
                  <i data-lucide="credit-card" style="width: 13px; height: 13px;"></i>
                  <span>Card</span>
                </button>
                <button type="button" class="payment-method-btn" data-method="upi">
                  <i data-lucide="smartphone" style="width: 13px; height: 13px;"></i>
                  <span>UPI / Wallet</span>
                </button>
              </div>
            </div>

            <div class="summary-row total" style="border-top: 1px dashed var(--border-color); padding-top: 8px; margin-top: 4px;">
              <span>Grand Total</span>
              <span id="checkout-grand-total">₹0.00</span>
            </div>
          </div>

          <!-- Actions triggers -->
          <div class="billing-actions" style="margin-top: 12px;">
            <button id="btn-send-kds" class="btn btn-secondary" style="flex: 1; height: 42px; font-size: 13px;">
              <i data-lucide="chef-hat" style="width: 16px; height: 16px;"></i>
              <span>Push KDS</span>
            </button>
            <button id="btn-pay-print" class="btn-place-order" style="flex: 1.4; margin-top: 0; height: 42px; font-size: 13px;">
              <i data-lucide="printer" style="width: 16px; height: 16px;"></i>
              <span>Settle & Print</span>
            </button>
          </div>
        </section>

      </div>
    </main>
  </div>

  <!-- DINE-IN MODIFIERS SELECTION MODAL -->
  <div id="modifier-modal" class="modal-backdrop" style="z-index: 2100;">
    <div class="glass-panel modal-content" style="position: relative; max-width: 480px; width: 100%; display: flex; flex-direction: column; max-height: 85vh;">
      <button id="close-modifier-modal" style="position: absolute; top: 16px; right: 16px; background: transparent; border: none; color: var(--text-muted); cursor: pointer;">
        <i data-lucide="x" style="width: 20px; height: 20px;"></i>
      </button>
      <div class="modifier-modal-header" style="text-align: left; margin-bottom: 16px; padding-right: 24px;">
        <h3 id="modifier-modal-dish-name" style="font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 4px;">Dish Name</h3>
        <p id="modifier-modal-dish-price" style="font-size: 14px; font-weight: 700; color: var(--primary-hover);">₹0.00</p>
      </div>

      <!-- Scrollable content -->
      <div id="modifier-groups-container" style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; padding-right: 4px; margin-bottom: 16px; text-align: left;">
        <!-- Dynamically populated groups -->
      </div>

      <!-- Special instructions text field -->
      <div style="text-align: left; margin-bottom: 16px;">
        <label for="modifier-special-instructions" style="font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; display: block;">Special Instructions (Optional)</label>
        <textarea id="modifier-special-instructions" maxlength="100" placeholder="e.g. make it extra hot, no onions, etc." style="width: 100%; min-height: 50px; resize: none; font-size: 13px; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: rgba(0,0,0,0.2); color: #fff;"></textarea>
      </div>

      <button id="add-modified-to-cart-btn" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 14px; font-weight: 700; display: flex; justify-content: space-between; align-items: center;">
        <span>Add to Order</span>
        <span id="modifier-modal-subtotal">₹0.00</span>
      </button>
    </div>
  </div>

  <!-- Scripts -->
  <script type="module" src="js/order.js"></script>

  <!-- FastClick for touch delay elimination -->
  <script src="https://cdn.jsdelivr.net/npm/fastclick@1.0.6/lib/fastclick.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() { 
      FastClick.attach(document.body); 
    });
  </script>
</body>
</html>
